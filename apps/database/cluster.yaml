# CloudNativePG Cluster — HA PostgreSQL with primary + replicas
#
# Key concepts demonstrated here (relevant to KCNA):
#   - Custom Resource: Cluster is a CRD installed by the CNPG operator
#   - Operator pattern: CNPG watches this CR and reconciles the desired state
#   - StatefulSet under the hood: CNPG creates a StatefulSet for the pods
#   - PVC lifecycle: each instance gets its own PVC (volumeClaimTemplates)
#   - Service abstraction: CNPG creates three services automatically:
#       mattermost-db-rw  → always routes to primary (read-write)
#       mattermost-db-ro  → always routes to replicas (read-only)
#       mattermost-db-r   → routes to any instance
#
# HA behaviour:
#   If the primary pod is deleted or the node it runs on goes down:
#   1. CNPG detects the primary is gone (via failover timeout)
#   2. CNPG elects a replica as the new primary
#   3. The mattermost-db-rw Service selector is updated to the new primary
#   4. Mattermost reconnects on the next query retry
#   5. The old primary pod is restarted as a replica when its node recovers
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mattermost-db
  namespace: mattermost
spec:
  # 3 instances = 1 primary + 2 replicas. This gives CNPG another healthy
  # candidate if one worker wedges and avoids depending on a single replica.
  instances: 3

  # PostgreSQL version — pin to major.minor for reproducibility
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4

  # Bootstrap: create the mattermost database and mmuser role
  bootstrap:
    initdb:
      database: mattermost
      owner: mmuser
      # Secret created by ESO from AWS Secrets Manager
      secret:
        name: cnpg-app-user-secret

  # Storage — one EBS-backed PVC per instance, sized for the deployment.
  # WaitForFirstConsumer on the ebs-gp3 StorageClass keeps volumes in the same
  # AZ as the scheduled database pod, while avoiding node-local disk lock-in.
  # Existing live local-path PVCs cannot be resized in place. Keep
  # resizeInUseVolumes disabled while transitioning live clusters so old PVCs
  # stay untouched; fresh EBS PVCs still use the desired size below.
  storage:
    size: 20Gi
    storageClass: ebs-gp3
    resizeInUseVolumes: false

  # PostgreSQL configuration — tuned for t3.medium worker nodes
  # These parameters are PostgreSQL config values, not Kubernetes resource limits
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: "256MB"
      effective_cache_size: "768MB"
      work_mem: "4MB"
      maintenance_work_mem: "64MB"
      checkpoint_completion_target: "0.9"
      wal_buffers: "16MB"
      default_statistics_target: "100"
      log_min_duration_statement: "1000"  # Log slow queries > 1s

  # Resource limits — scoped to fit on t3.medium workers while leaving room for
  # Mattermost, ingress, ESO, Flux, and OpenClaw during a one-worker loss.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  # Anti-affinity: require database instances to land on different nodes.
  # With three workers, this prevents one node failure from taking out more than
  # one Postgres instance.
  affinity:
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  # Monitoring — exposes PostgreSQL metrics for Prometheus scraping
  # (used when you add the kube-prometheus-stack later)
  monitoring:
    enablePodMonitor: false   # set to true after adding Prometheus
