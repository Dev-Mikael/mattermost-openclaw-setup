apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  interval: 1h
  url: https://charts.jetstack.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 10m
  chart:
    spec:
      chart: cert-manager
      version: "v1.15.3"  # pinned — check https://github.com/cert-manager/cert-manager/releases
      sourceRef:
        kind: HelmRepository
        name: cert-manager
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  values:
    installCRDs: false  # managed by install.crds above
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    webhook:
      resources:
        requests: { cpu: 20m, memory: 32Mi }
        limits:   { cpu: 100m, memory: 64Mi }
    cainjector:
      resources:
        requests: { cpu: 20m, memory: 64Mi }
        limits:   { cpu: 100m, memory: 128Mi }
