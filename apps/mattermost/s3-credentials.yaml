# S3 credentials Secret for Mattermost fileStore.external.secret
#
# On EC2 with IAM instance profiles, Mattermost's AWS SDK picks up credentials
# automatically from the instance metadata service (IMDS) when access key is empty.
# We create the Secret with empty keys to satisfy the operator's schema requirement
# while letting the SDK use the instance profile.
#
# This is a plain Secret (not ExternalSecret) because there are no secret values —
# the authentication happens via IAM, not static keys.
apiVersion: v1
kind: Secret
metadata:
  name: mattermost-s3-credentials
  namespace: mattermost
type: Opaque
stringData:
  accesskey: ""     # Empty = SDK uses instance profile credential chain
  secretkey: ""     # Empty = SDK uses instance profile credential chain
