apiVersion: v1
kind: ConfigMap
metadata:
  name: openclaw-config
  namespace: openclaw
  labels:
    app: openclaw
data:
  openclaw.json: |
    {
      "gateway": {
        "mode": "local",
        "bind": "lan",
        "port": 18789,
        "auth": {
          "mode": "token",
          "token": "$${OPENCLAW_GATEWAY_TOKEN}"
        },
        "controlUi": {
          "enabled": true,
          "allowedOrigins": [
            "https://openclaw.${DOMAIN}",
            "http://localhost:18789",
            "http://127.0.0.1:18789"
          ]
        }
      },
      "session": {
        "dmScope": "per-channel-peer"
      },
      "agents": {
        "defaults": {
          "workspace": "~/.openclaw/workspace",
          "model": {
            "primary": "google/gemini-2.5-flash-lite",
            "fallbacks": ["google/gemini-2.5-flash"]
          },
          "models": {
            "google/gemini-2.5-flash-lite": {
              "alias": "Gemini 2.5 Flash-Lite"
            },
            "google/gemini-2.5-flash": {
              "alias": "Gemini 2.5 Flash"
            }
          },
          "sandbox": {
            "mode": "off"
          }
        },
        "list": [
          {
            "id": "main",
            "name": "Mattermost Assistant",
            "workspace": "~/.openclaw/workspace"
          }
        ]
      },
      "tools": {
        "profile": "messaging",
        "exec": {
          "security": "deny",
          "ask": "always"
        },
        "elevated": {
          "enabled": false
        }
      },
      "channels": {
        "mattermost": {
          "enabled": true,
          "botToken": "$${MATTERMOST_BOT_TOKEN}",
          "baseUrl": "https://${DOMAIN}",
          "chatmode": "oncall",
          "dmPolicy": "${MM_BOT_DM_POLICY}",
          "groupPolicy": "open"
        }
      },
      "cron": {
        "enabled": false
      }
    }
  AGENTS.md: |
    # Mattermost Assistant

    You are OpenClaw running inside this Kubernetes cluster. Help Mattermost
    users clearly and safely.

    Answer ordinary questions using your model knowledge and reasoning. Do not
    claim that you can only use tools or that you cannot provide general
    information. You can explain countries, technology, writing, planning, and
    code concepts without needing a tool.

    Keep replies concise unless the user asks for detail. If a request needs
    live or current external data and no matching tool is available, say that
    live lookup is not enabled yet and offer useful general context instead.

    Do not run host commands from chat.
