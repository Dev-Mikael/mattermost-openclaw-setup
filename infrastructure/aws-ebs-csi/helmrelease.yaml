apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: aws-ebs-csi-driver
  namespace: flux-system
spec:
  interval: 1h
  url: https://kubernetes-sigs.github.io/aws-ebs-csi-driver
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-ebs-csi-driver
  namespace: kube-system
spec:
  interval: 10m
  chart:
    spec:
      chart: aws-ebs-csi-driver
      version: "2.58.0"
      sourceRef:
        kind: HelmRepository
        name: aws-ebs-csi-driver
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  values:
    controller:
      region: ${AWS_REGION}
      replicaCount: 2
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
      podDisruptionBudget:
        enabled: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
    node:
      enableWindows: false
      resources:
        requests:
          cpu: 10m
          memory: 40Mi
        limits:
          memory: 256Mi
    defaultStorageClass:
      enabled: false
    storageClasses:
      - name: ebs-gp3
        annotations:
          storageclass.kubernetes.io/is-default-class: "false"
        volumeBindingMode: WaitForFirstConsumer
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        parameters:
          type: gp3
          encrypted: "true"
