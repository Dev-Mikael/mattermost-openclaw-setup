# OpenClaw/KubeClaw layer. Runs after Mattermost exists so the setup script can
# create the Mattermost bot token and store it in AWS Secrets Manager.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: openclaw
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
    - name: cert-manager-config
    - name: external-secrets-config
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/kubeclaw
  prune: true
  wait: true
  timeout: 15m0s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-values

