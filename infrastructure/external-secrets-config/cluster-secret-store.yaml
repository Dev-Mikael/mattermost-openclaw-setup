# ClusterSecretStore — tells ESO how to authenticate with AWS Secrets Manager.
#
# On kubeadm (not EKS), there is no OIDC pod-level authentication.
# Instead, we rely on the EC2 instance profile attached to worker nodes.
# The AWS SDK default credential chain picks up the instance metadata
# credentials automatically — no static keys needed anywhere.
#
# When the ESO pod runs on a worker node, it inherits the node's IAM role
# worker nodes, which have GetSecretValue permission on the configured
# ${SECRET_PREFIX}/* secret prefix.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      # No auth block = use ambient AWS credentials (EC2 instance profile)
      # This is the correct approach for kubeadm on EC2.
