# ClusterSecretStore depends on ESO CRDs — applied AFTER infrastructure
# This must be Ready before the database Kustomization runs, because the
# database Kustomization creates ExternalSecrets that reference this store.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-secrets-config
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/external-secrets-config
  prune: true
  wait: true
  timeout: 5m0s
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-values
