# CNPG Cluster + ExternalSecrets for DB password.
# Must run AFTER:
#   - infrastructure (CNPG operator installed)
#   - external-secrets-config (ClusterSecretStore ready, so ExternalSecrets can sync)
# The ExternalSecret in this path creates the DB secret, which CNPG uses for
# bootstrap. All three resources are applied together; CNPG retries until the
# secret exists (handled by the operator's reconciliation loop).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: database
  namespace: flux-system
spec:
  interval: 5m0s
  dependsOn:
    - name: infrastructure
    - name: external-secrets-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/database
  prune: true
  wait: true
  timeout: 15m0s  # CNPG cluster initialisation takes several minutes
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-values
