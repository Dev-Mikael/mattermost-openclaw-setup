# ExternalSecret — ESO reads this, calls AWS Secrets Manager, and creates
# two native Kubernetes Secrets that CNPG and Mattermost use:
#
#   cnpg-app-user-secret:
#     Used by the CNPG Cluster as the application user (mmuser) password.
#     CNPG creates the PostgreSQL role using this secret at cluster bootstrap.
#
#   mattermost-db-credentials:
#     The full connection string used by the Mattermost operator to connect to
#     the database. Points to the CNPG read-write service which always follows
#     the primary, so failover is transparent to Mattermost.
#
# Both are derived from a single secret in Secrets Manager for simplicity.
# In a larger system you would have separate secrets per credential.
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: mattermost
spec:
  refreshInterval: 1h   # ESO re-reads from Secrets Manager every hour
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: cnpg-app-user-secret
    creationPolicy: Owner   # ESO owns this Secret — deleted when ExternalSecret is deleted
    template:
      type: kubernetes.io/basic-auth
      data:
        # CNPG expects username and password keys for bootstrap.initdb.secret
        username: "mmuser"
        password: "{{ .dbpassword }}"
  data:
    - secretKey: dbpassword
      remoteRef:
        key: ${SECRET_PREFIX}/db-password
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-connection-string
  namespace: mattermost
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: mattermost-db-credentials
    creationPolicy: Owner
    template:
      data:
        # mattermost-db-rw is the CNPG service that always points to the primary.
        # After a failover, CNPG promotes a replica and updates the service selector —
        # Mattermost reconnects automatically without any configuration change.
        DB_CONNECTION_STRING: >-
          postgres://mmuser:{{ .dbpassword }}@mattermost-db-rw.mattermost.svc.cluster.local:5432/mattermost?sslmode=disable
  data:
    - secretKey: dbpassword
      remoteRef:
        key: ${SECRET_PREFIX}/db-password
