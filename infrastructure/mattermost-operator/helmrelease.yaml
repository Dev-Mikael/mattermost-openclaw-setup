apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: mattermost
  namespace: flux-system
spec:
  interval: 1h
  url: https://helm.mattermost.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mattermost-operator
  namespace: mattermost-operator
spec:
  interval: 10m
  chart:
    spec:
      chart: mattermost-operator
      version: "1.0.6"  # pinned — check https://helm.mattermost.com
      sourceRef:
        kind: HelmRepository
        name: mattermost
        namespace: flux-system
      interval: 1h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
      remediateLastFailure: true
      strategy: rollback
  values:
    replicaCount: 1
    watchNamespace: ""
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
