# ExternalSecret for OpenClaw runtime credentials.
# Values are written by scripts/07-setup-openclaw.sh after Mattermost creates
# the openclaw-bot token.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: openclaw-secrets
  namespace: openclaw
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: openclaw-secrets
    creationPolicy: Owner
    template:
      data:
        OPENCLAW_GATEWAY_TOKEN: "{{ .gatewayToken }}"
        GEMINI_API_KEY: "{{ .geminiApiKey }}"
        GOOGLE_API_KEY: "{{ .geminiApiKey }}"
        ANTHROPIC_API_KEY: "{{ .anthropicApiKey }}"
        MATTERMOST_BOT_TOKEN: "{{ .mattermostBotToken }}"
  data:
    - secretKey: gatewayToken
      remoteRef:
        key: ${SECRET_PREFIX}/openclaw-gateway-token
    - secretKey: geminiApiKey
      remoteRef:
        key: ${SECRET_PREFIX}/gemini-api-key
    - secretKey: anthropicApiKey
      remoteRef:
        key: ${SECRET_PREFIX}/anthropic-api-key
    - secretKey: mattermostBotToken
      remoteRef:
        key: ${SECRET_PREFIX}/mattermost-bot-token
